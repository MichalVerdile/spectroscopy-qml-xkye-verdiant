name: Raw-native benchmark contracts
on:
  push:
    branches: ['research/raw-native-fair-tensor-network-benchmark*']
  pull_request:
    paths:
      - 'src/spectroscopy_qml/benchmarking/**'
      - 'tests/test_raw_native*'
      - 'scripts/*raw_native*'
      - 'requirements-raw-native.txt'
      - '.github/workflows/raw-native.yml'
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-raw-native.txt
      - run: python -m pytest -o addopts='' -q
      - run: python -m ruff check src/spectroscopy_qml/benchmarking/raw* scripts/*raw_native*.py tests/test_raw_native*.py
      - run: python -m mypy --follow-imports=silent --ignore-missing-imports src/spectroscopy_qml/benchmarking/raw*.py src/spectroscopy_qml/benchmarking/raw_models
  powershell:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-raw-native.txt
      - name: PowerShell 7 wrapper
        shell: pwsh
        run: ./scripts/run_raw_native_benchmark.ps1 --help
      - name: Windows PowerShell 5.1 wrapper
        shell: powershell
        run: ./scripts/run_raw_native_benchmark.ps1 --help
      - name: Native synthetic smoke via PowerShell
        shell: pwsh
        run: ./scripts/run_raw_native_benchmark.ps1 --smoke-test --phase all --epochs 1 --threads 2 --experiment-id windows_ci
